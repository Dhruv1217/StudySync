{% extends "base.html" %}
{% block title %}Login – StudySync{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-card">
        <div class="logo">⚡ StudySync</div>
        <h2>
            Welcome Back
            <small>Login to your account</small>
        </h2>

        <form method="POST" action="{{ url_for('login_page') }}" id="login-form">
            <div class="form-group">
                <label for="roll_number">Roll Number</label>
                <input type="text" id="roll_number" name="roll_number" class="form-control"
                       placeholder="Enter your roll number" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary">Login →</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('signup_page') }}">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}
