{% extends "base.html" %}
{% block title %}Sign Up – StudySync{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-card" style="max-width: 540px;">
        <div class="logo">⚡ StudySync</div>
        <h2>
            Create Account
            <small>Join StudySync today</small>
        </h2>

        <form method="POST" action="{{ url_for('signup_page') }}" id="signup-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control"
                       placeholder="Enter your full name" required>
                <div class="form-hint">Letters and spaces only</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="roll_number">Roll Number</label>
                    <input type="text" id="roll_number" name="roll_number" class="form-control"
                           placeholder="e.g. 22" required>
                </div>

                <div class="form-group">
                    <label for="branch">Branch</label>
                    <select id="branch" name="branch" class="form-control" required>
                        <option value="" disabled selected>Select Branch</option>
                        <option value="CSE">CSE</option>
                        <option value="CSE AI">CSE AI</option>
                        <option value="IT">IT</option>
                        <option value="ECE">ECE</option>
                        <option value="EE">EE</option>
                        <option value="ME">ME</option>
                        <option value="CE">CE</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="semester">Semester</label>
                    <select id="semester" name="semester" class="form-control" required>
                        <option value="" disabled selected>Select</option>
                        {% for i in range(1, 9) %}
                        <option value="{{ i }}">Semester {{ i }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="you@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Create a password" required>
                <div class="form-hint">Minimum 6 characters, must contain at least one number</div>
            </div>

            <button type="submit" class="btn btn-primary">Create Account →</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login_page') }}">Login</a>
        </div>
    </div>
</div>
{% endblock %}
