{% extends "dashboard.html" %}
{% block title %}Change Password – StudySync{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="card password-form animate-in">
    <div class="card-header">
        <h2>🔑 Change Password</h2>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('change_password_page') }}">
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" class="form-control"
                       placeholder="Enter current password" required>
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control"
                       placeholder="Enter new password" required>
                <div class="form-hint">Minimum 6 characters, must contain at least one number</div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                       placeholder="Confirm new password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
